<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCloud — бұлттық оқу платформасы</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="hero">
      <div class="logo">☁️ EduCloud</div>
      <h1>Бұлттық оқу платформасы</h1>
      <p>Мұғалім тапсырма береді, студент кез келген құрылғыдан орындайды. Барлық деректер бұлтта сақталып, нақты уақытта жаңарады.</p>
      <ul class="tech">
        <li><b>GitHub Pages</b> — бұлттық хостинг</li>
        <li><b>Firebase Authentication</b> — тіркелу және кіру</li>
        <li><b>Cloud Firestore</b> — бұлттық дерекқор</li>
      </ul>
    </section>

    <section class="card auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Кіру</button>
        <button class="tab" data-tab="register">Тіркелу</button>
      </div>

      <form id="loginForm">
        <label>Email<input type="email" id="loginEmail" required></label>
        <label>Құпиясөз<input type="password" id="loginPassword" required></label>
        <button type="submit" class="btn">Кіру</button>
      </form>

      <form id="registerForm" class="hidden">
        <label>Аты-жөні<input type="text" id="regName" required></label>
        <label>Email<input type="email" id="regEmail" required></label>
        <label>Құпиясөз (кемінде 6 таңба)<input type="password" id="regPassword" minlength="6" required></label>
        <label>Рөлі
          <select id="regRole">
            <option value="student">Студент</option>
            <option value="teacher">Мұғалім</option>
          </select>
        </label>
        <button type="submit" class="btn">Тіркелу</button>
      </form>

      <p id="authError" class="error"></p>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
